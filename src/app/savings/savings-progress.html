<div class="flex items-center gap-3">
  <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-blue-50 text-blue-700"><svg lucideIcon="laptop" [size]="19" aria-hidden="true" /></span>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-semibold">{{ savingsName }}</p>
    <p class="text-xs text-slate-500">MMK {{ money(saved()) }} of {{ money(savingsTarget) }}</p>
  </div>
  <span class="text-xs font-semibold text-blue-700">{{ goalProgress() }}%</span>
</div>
<progress class="mt-4 block h-2 w-full overflow-hidden rounded-full bg-slate-100 [&::-moz-progress-bar]:bg-blue-600 [&::-webkit-progress-bar]:rounded-full [&::-webkit-progress-bar]:bg-slate-100 [&::-webkit-progress-value]:rounded-full [&::-webkit-progress-value]:bg-blue-600"
          [value]="goalProgress()" max="100" [attr.aria-label]="savingsName + ' savings progress'"></progress>
